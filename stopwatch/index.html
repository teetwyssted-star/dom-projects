<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-[#101714] flex justify-center font-inter py-10">
    <div class="bg-[#19231E8C] w-[620px] h-[551px] rounded-[28px] p-[40px] border border-1px border-[#FFFFFF26]">
      <div class="flex justify-between">
        <div class="bg-[#B5CBB21A] rounded-xl w-[44px] h-[44px] flex justify-center items-center">
          <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path d="M19.1673 13.4167C19.1673 17.6508 15.7348 21.0833 11.5007 21.0833C7.26647 21.0833 3.83398 17.6508 3.83398 13.4167C3.83398 9.18248 7.26647 5.75 11.5007 5.75C15.7348 5.75 19.1673 9.18248 19.1673 13.4167Z" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
         <path d="M11.5 9.58341V13.4167L13.4167 15.3334M8.625 1.91675H11.5M11.5 1.91675H14.375M11.5 1.91675V5.75008M17.25 6.70841L19.1667 4.79175" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
         </svg>
        </div>
        <div
        id="state" 
        class="bg-[#B5CBB20D] rounded-[99px] text-xs text-[#C5D9BD] h-[29px] px-3 py-1.5 border border-1px border-[#FFFFFF26]">
        Ready
       </div>
      </div>
      <div class="text-[#F0FDF4] text-[40px] mt-7 tracking-[-1px]">Stopwatch</div>
      <div class="text-[#A4B9AD] text-sm mt-2">Make time for what matters.</div>
      
      <div class=" w-[540px] flex justify-center text-[#EDF3E8] mt-9 border-y border-[#B5CBB226] py-9"> 


       <div 
       id="timer" class="h-[86px] grid grid-cols-[1fr_20px_1fr_20px_1fr] gap-3">
         <div 
          class="h-[56px] w-[166.67px] flex flex-col items-center gap-4">
           <span
           id="hours" 
           class="text-[56px] font-mono leading-none font-light">00</span>
           <span class="text-[9px] text-[#9BAD9E] flex justify-center tracking-[2px]">HOURS</span>
         </div>

         <span class="font-mono leading-[56px] text-[40px]">:</span>

         <div 
         class="h-[56px] w-[166.67px] flex flex-col items-center gap-4">
           <span 
           id="minutes"
           class="text-[56px] font-mono leading-none">00</span>
           <span class="text-[9px] text-[#9BAD9E] flex justify-center tracking-[2px]">MINUTES</span>
         </div>
       
         <span class="font-mono leading-[56px] text-[40px]">:</span>

         <div 
         class="h-[56px] w-[166.67px] flex flex-col items-center gap-4">
           <span 
           id="seconds"
           class="text-[56px] font-mono leading-none text-[#C5D9BD]">00</span>
           <span class="text-[9px] text-[#9BAD9E] flex justify-center tracking-[2px]">SECONDS</span>
         </div>
       
       </div>
      </div>

      <div class="mt-8 grid grid-cols-[2fr_1fr_1fr] gap-3">

       <button 
       id="start-button"
       type="button"
       class="w-[258px] h-[48px] cursor-pointer bg-[#B5CBB2] rounded-[12px] flex justify-center items-center text-[#102418] text-[14px]">
       Start
       </button>

       <button 
       id="stop-button"
       type="button"
       disabled
       class="w-[129px] h-[48px] cursor-pointer flex justify-center items-center border border-1px border-[#FFFFFF1A] w-[129px] h-[48px] rounded-[12px] text-[#DCECE2] text-[14px] disabled:cursor-not-allowed disabled:opacity-35">
       Pause
       </button>

       <button 
       id="reset-button"
       type="button"  
       disabled
       class="w-[129px] h-[48px] cursor-pointer flex justify-center items-center border border-1px border-[#FFFFFF1A] bg-[#FFFFFF0D] rounded-xl text-[#A4B9AD] text-[14px] disabled:cursor-not-allowed disabled:opacity-35">
       Reset
       </button>
      </div>
      <div class="flex justify-center items-center mt-5 text-[#8AA294] text-[12px]">A moment of focus. At your own pace.</div>
    </div>
  </body>
</html>
