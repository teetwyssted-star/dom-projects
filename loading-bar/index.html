<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading · Forma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-[#190B10] h-screen font-inter flex justify-center items-center">
    <div class="w-[840px] max-w-[95vw] flex flex-col items-center">
     
      <div class="text-[#C4A2AB] text-[10px] tracking-[3px] leading-[100%] mb-6">
     —  LET’S GET YOU STARTED  —
     </div>

      <div class="w-full bg-[#260F17] border border-[#46232E] rounded-[24px] overflow-hidden">

        <div class="p-[48px]">

         <div class="flex justify-between">
            <div class="text-[#FF9299] text-[10px] tracking-[1.5px]">
            GETTING READY
           </div>
           <div class="text-[#C4A2AB] text-[11px]">
            01 — 03
           </div>
         </div>

         <div class="text-[#FFF5EE] text-[40px] font-semibold tracking-[-1.8px] mt-7 leading-tight">
          Something good is coming.
         </div>

         <div class="text-[#C4A2AB] text-[15px] mt-3">
          A little preparation for a great beginning.
         </div>

         <div class="flex justify-between items-center mt-9 gap-6">
           <div class="flex items-end gap-[8px] shrink-0">
             <span id="counter" class="text-[#FFF5EE] text-[112px] font-medium leading-none tracking-[-7px]">64</span>
             <span class="text-[#FF6470] text-[38px] font-light">%</span>
           </div>

           <div id="message" class="text-[#C4A2AB] text-[14px] whitespace-nowrap">Bringing everything together</div>
         </div>

         <div id="loading-progress" class="bg-[#46232E] w-full h-[12px] rounded-[6px] mt-6 overflow-hidden">
           <div id="loading-bar" class="bg-[#EF3340] w-0 h-full rounded-[6px]"></div>
         </div>

         <div class="flex justify-between tracking-[1px] mt-4">
           <div class="text-[#C4A2AB] text-[10px]">PREPARING YOUR EXPERIENCE</div>
           <div class="text-[#C4A2AB] text-[10px]">JUST A MOMENT</div>
         </div>

       </div>
       <div class="w-full text-[#C4A2AB] text-[12px] bg-[#1E0C13] h-[56px] flex justify-center items-center">→  Your welcome page will open automatically.</div>
     </div>
    </div>
  </body>
</html>
