<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="bg-[#09090B] py-[40px] px-[100px]">
    
    <div class="flex justify-between">
      <div flex flex-col>
        <div class="text-[#F4F4F5]">Color palettes.</div>
        <div class="text-[#A1A1AA]">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</div>
      </div>
      <button
      id="shuffle-colors"
      type="button" 
      class="bg-[#D9F99D] rounded-[12px] w-[186px] h-[48px]">
        <div></div>
        <div>Shuffle palettes</div>
      </button>
    </div>

    <div class="flex justify-between text-[#A1A1AA]">
      <div>100 → 950 · LIGHT TO DARK</div>
      <p 
      id="status">
      Ready to explore.</p>
    </div>

   <div
   id="colors">
     <div>
        <div class="text-[#E4E4E7]">Red</div>
        <div></div>
     </div>

     <div>
        <div class="text-[#E4E4E7]">Amber</div>
        <div></div>
     </div>

     <div>
        <div class="text-[#E4E4E7]">Emerald</div>
        <div></div>
     </div>

     <div>
        <div class="text-[#E4E4E7]">Sky</div>
       <div></div>
     </div>
    
     <div>
        <div class="text-[#E4E4E7]">Violet</div>
       <div></div>
     </div>

     <div>
        <div class="text-[#E4E4E7]">Pink</div>
       <div></div>
     </div>
   </div>
  </body>
</html>
